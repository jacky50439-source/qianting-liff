
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>芊町 AI 助理｜入口測試</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f6f8;
      padding: 30px 16px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
    }
    .status {
      color: #16803c;
      font-weight: bold;
    }
    .id {
      overflow-wrap: anywhere;
      padding: 12px;
      background: #f1f3f5;
      border-radius: 8px;
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="card">
    <h2>芊町 AI 助理</h2>
    <h3>LINE LIFF 入口測試</h3>

    <p id="status">檢查網址中...</p>
    <p>收到的測試 ID：</p>
    <p class="id" id="tempId">尚未讀取</p>

    <p>目前沒有連接公司財務資料。</p>
  </div>


<script>
  async function startApp() {
    const status = document.getElementById('status');
    const output = document.getElementById('tempId');

    status.textContent = 'LINE LIFF 初始化中...';

    try {
      
      await liff.init({
        liffId: '2012604894-ztr2T9nZ'
      });

      // 檢查 LINE 登入狀態
      const loginStatus = document.createElement('p');

      if (liff.isLoggedIn()) {
        loginStatus.textContent = 'LINE 登入狀態：已登入';
        loginStatus.style.color = '#16803c';
      } else {
        loginStatus.textContent = 'LINE 登入狀態：尚未登入';
        loginStatus.style.color = '#c62828';
      }

      document.querySelector('.card').appendChild(loginStatus);

      // 保留原本的發票 ID 讀取功能
      const params = new URLSearchParams(window.location.search);

      let tempId = params.get('id');

      if (!tempId) {
        const state = params.get('liff.state');

        if (state) {
          const stateParams = new URLSearchParams(
            state.replace(/^\?/, '')
          );
          tempId = stateParams.get('id');
        }
      }

      if (tempId) {
        status.textContent = '網址參數接收成功';
        status.className = 'status';
        output.textContent = tempId;
      } else {
        status.textContent = 'LIFF 初始化成功，但沒有收到 ID';
        output.textContent = '網址沒有 id 參數';
      }

    } catch (error) {
      status.textContent = 'LIFF 初始化失敗';
      output.textContent = error.message || String(error);
    }
  }

  startApp();
</script>

</body>
</html>
